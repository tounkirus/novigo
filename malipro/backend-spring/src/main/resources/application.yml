spring:
  application:
    name: novigo-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}
  data:
    redis:
      repositories:
        enabled: false  # Redis = cache uniquement ; les repositories sont JPA
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain,text/css,application/javascript

novigo:
  version: 0.1.0
  mode: ${NOVIGO_MODE:demo}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5000}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:change-me-access-secret-please-override-in-production-32bytes-min}
    refresh-secret: ${JWT_REFRESH_SECRET:change-me-refresh-secret-please-override-in-production-32byte-min}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: novigo-api
