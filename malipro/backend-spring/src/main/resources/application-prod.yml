# Mode PRODUCTION — configuration durcie, tout secret vient de l'environnement.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/novigo}
    username: ${DB_USER:novigo}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none      # Flyway est la source de vérité du schéma
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:novigo}
    password: ${RABBITMQ_PASSWORD}

server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.novigo: INFO

novigo:
  mode: production
