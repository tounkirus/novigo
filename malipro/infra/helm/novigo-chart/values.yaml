nameOverride: ""
fullnameOverride: ""

image:
  api:
    repository: novigo/api
    tag: latest
    pullPolicy: IfNotPresent
  web:
    repository: novigo/web
    tag: latest
    pullPolicy: IfNotPresent

api:
  port: 8080
  replicas: 2
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

web:
  port: 3000
  replicas: 2
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

postgres:
  enabled: true
  image: postgres:16-alpine
  db: novigo
  user: novigo
  storage: 5Gi

minio:
  enabled: true
  image: minio/minio:latest
  bucket: novigo
  storage: 10Gi
  publicUrl: "http://minio:9000"

redis:
  url: ""   # ex: redis://novigo-redis:6379 (managé ou sous-chart)

migrations:
  enabled: true

integrations:
  smsProvider: "console"   # console|http
  pushProvider: "console"  # console|fcm

observability:
  tracingEnabled: "false"   # "true" pour exporter les traces OTLP
  otlpEndpoint: ""          # ex: http://jaeger-collector:4318

config:
  corsOrigin: "https://app.novigo.ml"
  otpDevEcho: "false"

# À surcharger via --set ou un secret externe en production.
secrets:
  postgresPassword: "novigo"
  minioRootUser: "novigo"
  minioRootPassword: "novigo-secret"
  jwtAccessSecret: "change-me-access"
  jwtRefreshSecret: "change-me-refresh"

ingress:
  enabled: true
  className: nginx
  host: novigo.example.com
  tls: false
