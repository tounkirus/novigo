# ============================================================================
# NOVIGO API GATEWAY — point d'entrée public unique (Web · Android · iOS · Admin)
# Route chaque domaine vers son unique propriétaire (voir ARCHITECTURE-NOVIGO.md §3).
# Préfixes FINANCE -> Spring ; tout le reste (identité/ops/temps réel) -> Nest.
# ============================================================================

worker_processes auto;
events { worker_connections 4096; }

http {
  # --- Résolution DNS Docker (services découverts par nom) -------------------
  resolver 127.0.0.11 valid=10s ipv6=off;

  # --- Backends (via variables => pas de crash si un service démarre plus tard)
  # nest-api / spring-api = noms de service dans docker-compose.novigo.yml
  map $host $nest_upstream   { default "http://nest-api:8080"; }
  map $host $spring_upstream { default "http://spring-api:8081"; }

  # --- Support WebSocket (Socket.IO : Upgrade/Connection) --------------------
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # --- Rate limiting (bord) : 20 req/s par IP, burst 40 --------------------
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  # --- Logs -----------------------------------------------------------------
  log_format novigo '$remote_addr [$time_local] "$request" $status '
                    '-> $upstream_addr ${request_time}s';
  access_log /dev/stdout novigo;
  error_log  /dev/stderr warn;

  # --- Réglages proxy communs ----------------------------------------------
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout   60s;
  proxy_connect_timeout 5s;
  client_max_body_size 25m;   # aligné sur MinIO/multipart (uploads photos/docs)

  server {
    listen 80;
    server_name _;

    # -- Santé du gateway lui-même -----------------------------------------
    location = /gateway/health {
      add_header Content-Type application/json;
      return 200 '{"service":"novigo-gateway","status":"ok"}';
    }

    # ======================================================================
    # DOMAINES FINANCE / ADMIN / MARKETING  ->  Spring :8081
    # `^~` = préfixe prioritaire (l'emporte sur le fallback régulier)
    # ======================================================================
    location ^~ /api/v1/wallet        { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }
    location ^~ /api/v1/wallets       { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }
    location ^~ /api/v1/payments      { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }
    location ^~ /api/v1/invoices      { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }
    location ^~ /api/v1/billing       { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }
    location ^~ /api/v1/reports       { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }
    location ^~ /api/v1/analytics     { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }
    location ^~ /api/v1/promotions    { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }
    location ^~ /api/v1/coupons       { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }
    location ^~ /api/v1/loyalty       { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }
    location ^~ /api/v1/subscriptions { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }
    location ^~ /api/v1/ads           { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }
    location ^~ /api/v1/cash          { limit_req zone=api burst=40 nodelay; proxy_pass $spring_upstream; }

    # ======================================================================
    # TEMPS RÉEL Socket.IO (WebSocket)  ->  Nest :8080
    # ======================================================================
    location /socket.io/ {
      proxy_pass $nest_upstream;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;   # connexions longues
    }

    # ======================================================================
    # IDENTITÉ / OPS / SOCIAL / CATALOGUE  ->  Nest :8080  (fallback par défaut)
    # ======================================================================
    location /api/v1/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass $nest_upstream;
    }

    # Santé/metrics des backends (hors préfixe /api/v1) -> Nest par défaut
    location = /health  { proxy_pass $nest_upstream; }
    location = /metrics { proxy_pass $nest_upstream; }

    location / {
      add_header Content-Type application/json;
      return 404 '{"error":"not_found","gateway":"novigo"}';
    }
  }
}
